{% extends "base/base_dashboard.html" %}

{% block title %}Delete Doctor - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; padding: 2.25rem; text-align: center;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
  <h2>Remove Doctor?</h2>
  <p style="margin: 1rem 0 1.5rem; color: var(--text-secondary);">
    Are you sure you want to remove <strong>{{ object.full_name }}</strong> from your care directory?
  </p>

  <form method="post">
    {% csrf_token %}
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="{% url 'medical:doctor_list' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-danger">Confirm Removal</button>
    </div>
  </form>
</div>
{% endblock %}
