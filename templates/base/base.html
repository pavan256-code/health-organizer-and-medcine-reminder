{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <meta name="description" content="Local medicine reminder, health tracking, vital trends, and medical records organizer.">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Core Design System CSS (Cache-Busted v5.0 - Premium Visuals) -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v=5.0">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}?v=5.0">
  <link rel="stylesheet" href="{% static 'css/components.css' %}?v=5.0">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body_content %}{% endblock %}

  <!-- Core JavaScript (Cache-Busted v5.0) -->
  <script src="{% static 'js/main.js' %}?v=5.0"></script>
  {% if user.is_authenticated %}
  <script src="{% static 'js/notifications.js' %}?v=5.0"></script>
  {% endif %}
  {% block extra_js %}{% endblock %}
</body>
</html>
